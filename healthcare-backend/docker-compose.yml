# ==============================================================================
# Docker Compose for Healthcare Management Backend - PostgreSQL Database Service
# Configured for secure local development and cloud readiness.
# ==============================================================================

services:
  postgres:
    # Configurable PostgreSQL version (defaults to official postgres:16-alpine)
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-healthcare_db}
      # Ensure UTF-8 encoding across environments
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # Expose PostgreSQL on localhost (127.0.0.1) only for local development security
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Named persistent volume to ensure data survives container restarts & stop commands
      - healthcare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-healthcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  healthcare_postgres_data:
    name: healthcare_postgres_data
    # WARNING: Do NOT run 'docker compose down -v' as it removes this persistent volume.
